# Pneuma Sofer CI: unit tests, Vite build and an end-to-end run of the real Electron app.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    # Nightly run (03:17 UTC) to catch flaky or environment-dependent failures.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Web build
        run: npm run build:web

      - name: End-to-end in Electron
        run: |
          npm install --no-save playwright@1.63.0
          xvfb-run -a npm run test:e2e
