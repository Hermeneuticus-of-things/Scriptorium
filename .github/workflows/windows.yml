# Windows build: Inno Setup installer wizard (Scribner-Setup-<version>.exe) and portable .exe.
# Runs on every PR to main and on pushes to main (artifacts), and publishes a GitHub Release for v* tags.
name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      # The real app on Windows: paths with drive letters and backslashes, file locks,
      # native dialogs stubbed, every main flow (create, edit, split, snapshots, compile, import, export, backup).
      - name: E2E (real Electron app)
        run: |
          npm install --no-save playwright@1.63.0
          npm run test:e2e

      - name: Package app and portable
        run: npm run dist:win
        env:
          # No code-signing certificate: build unsigned instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }

      - name: Installer wizard
        run: npm run dist:win:setup

      - uses: actions/upload-artifact@v4
        with:
          name: Scribner-Windows
          path: |
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Scribner-Windows
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.exe --repo "${GITHUB_REPOSITORY}" --title "Scribner ${GITHUB_REF_NAME}" --generate-notes
