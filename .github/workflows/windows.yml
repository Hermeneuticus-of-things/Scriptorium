# Windows build: Inno Setup installer wizard (Scribner-Setup-<version>.exe) and portable .exe.
# Runs on every PR to main and on pushes to main (artifacts). Publishes a GitHub Release for v* tags and,
# on main, for the version in package.json when no release v<version> exists yet (tag created by gh).
name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      # The real app on Windows: paths with drive letters and backslashes, file locks,
      # native dialogs stubbed, every main flow (create, edit, split, snapshots, compile, import, export, backup).
      - name: E2E (real Electron app)
        run: |
          npm install --no-save playwright@1.63.0
          npm run test:e2e

      - name: Package app and portable
        run: npm run dist:win
        env:
          # No code-signing certificate: build unsigned instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }

      - name: Installer wizard
        run: npm run dist:win:setup

      - uses: actions/upload-artifact@v4
        with:
          name: Scribner-Windows
          path: |
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: package.json
      - uses: actions/download-artifact@v4
        with:
          name: Scribner-Windows
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG există deja; nimic de publicat."
              exit 0
            fi
          fi
          gh release create "$TAG" release/*.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Scribner $TAG" --generate-notes
