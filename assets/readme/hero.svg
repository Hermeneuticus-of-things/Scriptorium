<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Scribner</title>
  <desc id="desc">Scribner, locul în care cartea ta prinde formă: scrii pe bucăți, le muți cum vrei și la final primești cartea în Word, PDF sau e-book.</desc>
  <defs>
    <pattern id="cork" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c19466"/>
      <circle cx="3" cy="4" r="1.2" fill="#ab7f52"/>
      <circle cx="10" cy="9" r="1" fill="#d1a678"/>
      <circle cx="6" cy="12" r="0.9" fill="#a5784c"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#f3ecdf"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#paper)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#1f1b16">Scribner</text>
    <rect x="68" y="134" width="96" height="4" rx="2" fill="#c2413a"/>
    <text x="64" y="194" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#2c261f">Locul în care cartea ta prinde formă.</text>
    <text x="64" y="250" font-size="24" fill="#3d362d">Scrii pe bucăți: scene, capitole, idei.</text>
    <text x="64" y="284" font-size="24" fill="#3d362d">Le muți cum vrei, ca pe niște fișe.</text>
    <text x="64" y="318" font-size="24" fill="#3d362d">La final, cartea întreagă în Word, PDF sau e-book.</text>
    <g transform="translate(64 352)">
      <rect width="232" height="44" rx="22" fill="#1f1b16"/>
      <text x="116" y="29" text-anchor="middle" font-size="20" font-weight="600" fill="#fbf7ef">Gratuit · fără internet</text>
    </g>
    <g transform="translate(310 352)">
      <rect width="196" height="44" rx="22" fill="none" stroke="#1f1b16" stroke-width="2"/>
      <text x="98" y="29" text-anchor="middle" font-size="20" font-weight="600" fill="#1f1b16">AI doar dacă vrei</text>
    </g>
  </g>

  <!-- the writer's desk: cork board with three cards and a stack of pages -->
  <g transform="translate(720 52)">
    <rect width="420" height="300" rx="16" fill="url(#cork)"/>
    <g font-family="Georgia, serif">
      <g transform="translate(26 30) rotate(-3)">
        <rect width="118" height="150" rx="4" fill="#fffdf6"/>
        <rect y="34" width="118" height="2" fill="#c2413a"/>
        <circle cx="59" cy="-2" r="7" fill="#c2413a"/>
        <text x="10" y="24" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#1f1b16">Cap. 1</text>
        <g stroke="#d6e0ec"><line x1="0" y1="64" x2="118" y2="64"/><line x1="0" y1="92" x2="118" y2="92"/><line x1="0" y1="120" x2="118" y2="120"/></g>
        <text x="10" y="58" font-size="18" fill="#3a332b">Plecarea</text>
        <text x="10" y="86" font-size="18" fill="#3a332b">de acasă</text>
      </g>
      <g transform="translate(152 44) rotate(2)">
        <rect width="118" height="150" rx="4" fill="#fffdf6"/>
        <rect y="34" width="118" height="2" fill="#c2413a"/>
        <circle cx="59" cy="-2" r="7" fill="#2b6fd6"/>
        <text x="10" y="24" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#1f1b16">Cap. 2</text>
        <g stroke="#d6e0ec"><line x1="0" y1="64" x2="118" y2="64"/><line x1="0" y1="92" x2="118" y2="92"/><line x1="0" y1="120" x2="118" y2="120"/></g>
        <text x="10" y="58" font-size="18" fill="#3a332b">Drumul</text>
        <text x="10" y="86" font-size="18" fill="#3a332b">spre nord</text>
      </g>
      <g transform="translate(278 26) rotate(-1)">
        <rect width="118" height="150" rx="4" fill="#fffdf6"/>
        <rect y="34" width="118" height="2" fill="#c2413a"/>
        <circle cx="59" cy="-2" r="7" fill="#3f8f5a"/>
        <text x="10" y="24" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#1f1b16">Cap. 3</text>
        <g stroke="#d6e0ec"><line x1="0" y1="64" x2="118" y2="64"/><line x1="0" y1="92" x2="118" y2="92"/><line x1="0" y1="120" x2="118" y2="120"/></g>
        <text x="10" y="58" font-size="18" fill="#3a332b">Întoarcerea</text>
      </g>
    </g>
    <!-- arrow from the board to the finished book -->
    <path d="M210 212 C 210 250, 210 262, 210 280" stroke="#fbf7ef" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M198 270 L210 288 L222 270" stroke="#fbf7ef" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(822 318)" font-family="-apple-system, 'Segoe UI', sans-serif" font-weight="600" font-size="20">
    <rect width="66" height="70" rx="6" fill="#2b5797"/><text x="33" y="44" text-anchor="middle" fill="#fff">DOC</text>
    <rect x="80" width="66" height="70" rx="6" fill="#b3261e"/><text x="113" y="44" text-anchor="middle" fill="#fff">PDF</text>
    <rect x="160" width="66" height="70" rx="6" fill="#3f8f5a"/><text x="193" y="44" text-anchor="middle" fill="#fff">EPUB</text>
  </g>
</svg>
