<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Scribner</title>
  <desc id="desc">Scribner, program de scris pentru texte lungi în stilul Scrivener 3: binder cu Manuscris, Cercetare și Coș, fișe pe corkboard și Compile în DOCX, PDF și EPUB.</desc>
  <defs>
    <pattern id="cork" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#b8875a"/>
      <circle cx="3" cy="4" r="1.2" fill="#a2744a"/>
      <circle cx="10" cy="9" r="1" fill="#c99a6c"/>
      <circle cx="6" cy="12" r="0.9" fill="#9c6e45"/>
    </pattern>
    <clipPath id="board"><rect x="660" y="56" width="484" height="308" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#f6f1e6"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#7a6f60">PROGRAM DE SCRIS · TEXTE LUNGI</text>
    <text x="60" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#1f1b16">Scribner</text>
    <rect x="64" y="216" width="112" height="4" rx="2" fill="#c2413a"/>
    <text x="64" y="262" font-size="28" fill="#2c261f">Binder, corkboard, outline și Compile,</text>
    <text x="64" y="298" font-size="28" fill="#2c261f">ca în Scrivener 3. Deschide .scriv.</text>
    <text x="64" y="334" font-size="22" fill="#6b6357">AI opțional: totul merge și fără el.</text>
  </g>

  <g id="project-proof">
    <rect x="660" y="56" width="484" height="308" rx="14" fill="url(#cork)"/>
    <g clip-path="url(#board)">
      <!-- binder column -->
      <rect x="660" y="56" width="172" height="308" fill="#eef2f8"/>
      <rect x="831" y="56" width="1" height="308" fill="#c9d2df"/>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#22303f">
        <text x="680" y="96" font-weight="600">Manuscris</text>
        <text x="698" y="128">Partea întâi</text>
        <rect x="664" y="140" width="164" height="30" rx="4" fill="#2b6fd6"/>
        <text x="716" y="161" fill="#ffffff">Începutul</text>
        <text x="716" y="196">Drumul</text>
        <text x="680" y="240" font-weight="600">Cercetare</text>
        <text x="698" y="272">Andrei</text>
        <text x="680" y="316" font-weight="600">Coș</text>
      </g>
      <!-- index cards -->
      <g transform="translate(856 92) rotate(-2)">
        <rect width="134" height="170" rx="4" fill="#fffdf6"/>
        <rect x="0" y="36" width="134" height="2" fill="#c2413a"/>
        <text x="12" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#1f1b16">Începutul</text>
        <g stroke="#cfdcec" stroke-width="1">
          <line x1="0" y1="70" x2="134" y2="70"/><line x1="0" y1="98" x2="134" y2="98"/>
          <line x1="0" y1="126" x2="134" y2="126"/><line x1="0" y1="154" x2="134" y2="154"/>
        </g>
        <g font-family="Georgia, serif" font-size="18" fill="#3a332b">
          <text x="12" y="64">Eroul pleacă</text><text x="12" y="92">de acasă într-o</text><text x="12" y="120">dimineață</text><text x="12" y="148">de toamnă.</text>
        </g>
      </g>
      <g transform="translate(1004 102) rotate(2)">
        <rect width="124" height="170" rx="4" fill="#fffdf6"/>
        <rect x="0" y="36" width="124" height="2" fill="#c2413a"/>
        <text x="12" y="25" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#1f1b16">Drumul</text>
        <g stroke="#cfdcec" stroke-width="1">
          <line x1="0" y1="70" x2="124" y2="70"/><line x1="0" y1="98" x2="124" y2="98"/>
          <line x1="0" y1="126" x2="124" y2="126"/><line x1="0" y1="154" x2="124" y2="154"/>
        </g>
        <g font-family="Georgia, serif" font-size="18" fill="#3a332b">
          <text x="12" y="64">Pe drum</text><text x="12" y="92">întâlnește</text><text x="12" y="120">un bătrân</text><text x="12" y="148">și o hartă.</text>
        </g>
      </g>
      <!-- compile output chips -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">
        <rect x="856" y="308" width="76" height="34" rx="6" fill="#1f1b16"/><text x="871" y="331" fill="#f6f1e6">DOCX</text>
        <rect x="942" y="308" width="62" height="34" rx="6" fill="#1f1b16"/><text x="958" y="331" fill="#f6f1e6">PDF</text>
        <rect x="1014" y="308" width="72" height="34" rx="6" fill="#1f1b16"/><text x="1028" y="331" fill="#f6f1e6">EPUB</text>
      </g>
    </g>
  </g>

  <text x="64" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8a7f70">Electron · React · TipTap · Windows / web</text>
</svg>
