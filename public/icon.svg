    <path d="M0 -45 L 0 70" stroke="#14193a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- sound waves (dictation) -->
  <g fill="none" stroke="#f6d27a" stroke-linecap="round" stroke-width="11">
    <path d="M150 432 v -20"/><path d="M178 444 v -44"/><path d="M206 436 v -28"/><path d="M234 448 v -52"/><path d="M262 438 v -32"/><path d="M290 444 v -44"/><path d="M318 432 v -20"/>
