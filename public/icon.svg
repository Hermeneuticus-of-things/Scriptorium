  <!-- text lines left -->
  <g stroke="#2b3a67" stroke-width="10" stroke-linecap="round" opacity=".55">
    <path d="M118 170 C 160 162 200 166 230 180"/>
    <path d="M118 206 C 160 198 200 202 230 216"/>
    <path d="M118 242 C 160 234 200 238 230 252"/>
    <path d="M118 278 C 150 272 175 274 200 282"/>
  </g>
  <!-- fountain pen nib, writing on right page -->
  <g transform="translate(345 262) rotate(35) scale(0.78)">
    <path d="M0 -150 C 34 -112 46 -60 34 -6 L 0 74 L -34 -6 C -46 -60 -34 -112 0 -150 Z" fill="url(#gold)" stroke="#7a4f12" stroke-width="6" stroke-linejoin="round"/>
