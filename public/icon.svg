<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#14193a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="1" stop-color="#c98a2b"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#ece2cb"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- open book -->
  <path d="M256 150 C 210 118 140 112 86 124 L 86 370 C 140 358 210 364 256 396 Z" fill="url(#page)"/>
  <path d="M256 150 C 302 118 372 112 426 124 L 426 370 C 372 358 302 364 256 396 Z" fill="url(#page)"/>
